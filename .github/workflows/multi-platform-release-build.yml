name: Multi-Platform Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:
    name: Android release (signed when configured)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (Android release)
        uses: actions/checkout@v4.2.2
      - name: Set up JDK 17 (Android release)
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK (Android release)
        uses: android-actions/setup-android@v3.2.2
        with:
          packages: platform-tools
      - name: Set up Gradle (Android release)
        uses: gradle/actions/setup-gradle@v4.4.1
      - name: Configure Android signing (Android release)
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bbs-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/bbs-release.jks" >> "$GITHUB_ENV"
            echo "android_artifact_suffix=signed" >> "$GITHUB_OUTPUT"
            echo "Android release signing configured."
          else
            echo "android_artifact_suffix=unsigned" >> "$GITHUB_OUTPUT"
            echo "Android signing secrets are absent; producing an unsigned release APK."
          fi
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build Android release APK (Android release)
        run: sh ./gradlew :composeApp:assembleRelease --stacktrace
      - name: Upload Android release APK (Android release)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-release-${{ steps.signing.outputs.android_artifact_suffix }}
          path: composeApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

  desktop-release:
    name: ${{ matrix.platform }} desktop release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            gradle_command: sh ./gradlew
            package_task: :composeApp:packageAppImage
            artifact_glob: dist/Birth-By-Sleep-Final-ReMix-PSP-ISO-Patcher.AppImage
          - platform: Windows
            os: windows-latest
            gradle_command: .\\gradlew.bat
            package_task: :composeApp:packageExe
            artifact_glob: dist/Birth-By-Sleep-Final-ReMix-PSP-ISO-Patcher.exe
          - platform: macOS
            os: macos-latest
            gradle_command: sh ./gradlew
            package_task: :composeApp:packageDmg
            artifact_glob: composeApp/build/compose/binaries/main/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source (${{ matrix.platform }} release)
        uses: actions/checkout@v4.2.2
      - name: Set up JDK 17 (${{ matrix.platform }} release)
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle (${{ matrix.platform }} release)
        uses: gradle/actions/setup-gradle@v4.4.1
      - name: Build desktop release application (${{ matrix.platform }})
        run: ${{ matrix.gradle_command }} ${{ matrix.package_task }} --stacktrace
      - name: Package Linux AppImage
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          app_root="$(find composeApp/build/compose/binaries/main/app -mindepth 1 -maxdepth 1 -type d -print -quit)"
          if [ -z "$app_root" ]; then
            find composeApp/build/compose/binaries/main -maxdepth 5 -print
            exit 1
          fi
          app_dir="$RUNNER_TEMP/bbs-remix-appdir"
          rm -rf "$app_dir"
          mkdir -p "$app_dir/usr/share/applications" "$app_dir/usr/share/icons/hicolor/512x512/apps"
          cp -a "$app_root"/. "$app_dir"/
          cp packaging/linux/AppRun "$app_dir/AppRun"
          cp packaging/linux/bbs-remix.desktop "$app_dir/usr/share/applications/bbs-remix.desktop"
          cp packaging/linux/bbs-remix.desktop "$app_dir/bbs-remix.desktop"
          chmod +x "$app_dir/AppRun"
          icon="$(find "$app_root" -type f -iname '*.png' -print -quit)"
          if [ -z "$icon" ]; then
            echo "Compose distribution did not contain a PNG icon." >&2
            exit 1
          fi
          cp "$icon" "$app_dir/.DirIcon"
          cp "$icon" "$app_dir/bbs-remix.png"
          cp "$icon" "$app_dir/usr/share/icons/hicolor/512x512/apps/bbs-remix.png"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          mkdir -p dist
          APPIMAGE_EXTRACT_AND_RUN=1 "$RUNNER_TEMP/appimagetool" "$app_dir" \
            dist/Birth-By-Sleep-Final-ReMix-PSP-ISO-Patcher.AppImage
          chmod +x dist/Birth-By-Sleep-Final-ReMix-PSP-ISO-Patcher.AppImage

      - name: Package Windows portable EXE
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $candidate = Get-ChildItem -Path composeApp/build/compose/binaries/main -Recurse -File -Filter *.exe | Select-Object -First 1
          if ($null -eq $candidate) {
            Get-ChildItem -Path composeApp/build/compose/binaries/main -Recurse
            exit 1
          }
          Copy-Item $candidate.FullName dist/Birth-By-Sleep-Final-ReMix-PSP-ISO-Patcher.exe
      - name: Upload desktop release application (${{ matrix.platform }})
        uses: actions/upload-artifact@v4.6.2
        with:
          name: desktop-release-${{ matrix.platform }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  source-sha-release:
    name: Source and checksums (release)
    needs: [android-release, desktop-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (release source archive)
        uses: actions/checkout@v4.2.2
      - name: Download application artifacts (release)
        uses: actions/download-artifact@v4.3.0
        with:
          path: release-files
          merge-multiple: true
      - name: Create Source.zip and SHA.zip (release)
        run: |
          git archive --format=zip --output=release-files/Source.zip HEAD
          (
            cd release-files
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' ! -name 'SHA.zip' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            zip -q SHA.zip SHA256SUMS.txt
          )
      - name: Upload Source.zip (release)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: source-release
          path: release-files/Source.zip
          if-no-files-found: error
      - name: Upload SHA.zip (release)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: sha-release
          path: release-files/SHA.zip
          if-no-files-found: error
  attach-release-assets:
    name: Attach release assets (version tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android-release, desktop-release, source-sha-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts (release)
        uses: actions/download-artifact@v4.3.0
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Attach artifacts to GitHub Release (release)
        uses: softprops/action-gh-release@v2.2.2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/**/*
