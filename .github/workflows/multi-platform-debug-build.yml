name: Multi-Platform Debug Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3.2.2
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4.4.1
      - name: Test and build Android debug
        run: |
          ./gradlew :composeApp:testDebugUnitTest :composeApp:assembleDebug --stacktrace
          mkdir -p dist
          cp "$(find composeApp/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"             dist/Birth-By-Sleep-Final-ReMix-PSP-ISO-Patcher-Android-Debug.apk
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: Android-Debug
          path: dist/Birth-By-Sleep-Final-ReMix-PSP-ISO-Patcher-Android-Debug.apk
          if-no-files-found: error

  windows-debug:
    name: Windows portable EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4.4.1
      - name: Test and build Windows app image
        run: .\gradlew.bat :composeApp:desktopTest :composeApp:createDistributable --stacktrace
      - name: Package portable Windows executable
        shell: powershell
        run: .\packaging\package-windows-portable.ps1 -Configuration Debug
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: Windows-Debug
          path: dist/Birth-By-Sleep-Final-ReMix-PSP-ISO-Patcher-Windows-x64-Debug.exe
          if-no-files-found: error

  linux-debug:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4.4.1
      - name: Test and build Linux app image
        run: ./gradlew :composeApp:desktopTest :composeApp:createDistributable --stacktrace
      - name: Package Linux AppImage
        run: |
          chmod +x packaging/package-linux-appimage.sh
          packaging/package-linux-appimage.sh Debug
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: Linux-Debug
          path: dist/Birth-By-Sleep-Final-ReMix-PSP-ISO-Patcher-Linux-x86_64-Debug.AppImage
          if-no-files-found: error

  macos-debug:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4.4.1
      - name: Test and build macOS DMG
        run: |
          ./gradlew :composeApp:desktopTest :composeApp:packageDmg --stacktrace
          mkdir -p dist
          cp "$(find composeApp/build/compose/binaries/main/dmg -name '*.dmg' -type f | head -n 1)"             dist/Birth-By-Sleep-Final-ReMix-PSP-ISO-Patcher-macOS-Debug.dmg
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: macOS-Debug
          path: dist/Birth-By-Sleep-Final-ReMix-PSP-ISO-Patcher-macOS-Debug.dmg
          if-no-files-found: error

  source-debug:
    name: Source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Create Source.zip
        run: git archive --format=zip --output=Source.zip HEAD
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: Source
          path: Source.zip
          if-no-files-found: error

  checksums-debug:
    name: SHA archive
    needs: [android-debug, windows-debug, linux-debug, macos-debug, source-debug]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      - name: Create SHA.zip
        run: |
          find artifacts -type f -print0 | sort -z | xargs -0 sha256sum | sed 's#  artifacts/#  #' > SHA256SUMS.txt
          zip -j SHA.zip SHA256SUMS.txt
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: SHA
          path: SHA.zip
          if-no-files-found: error
