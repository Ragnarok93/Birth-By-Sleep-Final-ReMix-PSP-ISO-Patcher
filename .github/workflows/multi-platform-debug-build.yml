name: Multi-Platform Debug Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Android debug (ubuntu / ${{ github.event_name }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (Android)
        uses: actions/checkout@v4.2.2
      - name: Set up JDK 17 (Android)
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK (Android)
        uses: android-actions/setup-android@v3.2.2
        with:
          packages: platform-tools
      - name: Set up Gradle (Android)
        uses: gradle/actions/setup-gradle@v4.4.1
      - name: Run Android debug unit tests (Android)
        run: sh ./gradlew :composeApp:testDebugUnitTest --stacktrace
      - name: Build Android debug APK (Android)
        run: sh ./gradlew :composeApp:assembleDebug --stacktrace
      - name: Upload Android debug APK (Android)
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  desktop-debug:
    name: ${{ matrix.platform }} desktop debug
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            gradle_command: sh ./gradlew
            package_task: :composeApp:packageAppImage
            artifact_glob: dist/Birth-By-Sleep-Final-ReMix-PSP-ISO-Patcher.AppImage
          - platform: Windows
            os: windows-latest
            gradle_command: .\\gradlew.bat
            package_task: :composeApp:packageExe
            artifact_glob: dist/Birth-By-Sleep-Final-ReMix-PSP-ISO-Patcher.exe
          - platform: macOS
            os: macos-latest
            gradle_command: sh ./gradlew
            package_task: :composeApp:packageDmg
            artifact_glob: composeApp/build/compose/binaries/main/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source (${{ matrix.platform }})
        uses: actions/checkout@v4.2.2
      - name: Set up JDK 17 (${{ matrix.platform }})
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle (${{ matrix.platform }})
        uses: gradle/actions/setup-gradle@v4.4.1
      - name: Run shared desktop tests (${{ matrix.platform }})
        run: ${{ matrix.gradle_command }} :composeApp:desktopTest --stacktrace
      - name: Build desktop application (${{ matrix.platform }})
        run: ${{ matrix.gradle_command }} ${{ matrix.package_task }} --stacktrace
      - name: Normalize Linux application artifact
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          candidate="$(find composeApp/build/compose/binaries/main -type f -iname '*.appimage' -print -quit)"
          if [ -z "$candidate" ]; then
            find composeApp/build/compose/binaries/main -maxdepth 5 -print
            exit 1
          fi
          cp "$candidate" dist/Birth-By-Sleep-Final-ReMix-PSP-ISO-Patcher.AppImage
      - name: Normalize Windows application artifact
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $candidate = Get-ChildItem -Path composeApp/build/compose/binaries/main -Recurse -File -Filter *.exe | Select-Object -First 1
          if ($null -eq $candidate) {
            Get-ChildItem -Path composeApp/build/compose/binaries/main -Recurse
            exit 1
          }
          Copy-Item $candidate.FullName dist/Birth-By-Sleep-Final-ReMix-PSP-ISO-Patcher.exe
      - name: Upload desktop application (${{ matrix.platform }})
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: desktop-debug-${{ matrix.platform }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  source-sha-debug:
    name: Source and checksums (debug)
    needs: [android-debug, desktop-debug]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (debug source archive)
        uses: actions/checkout@v4.2.2
      - name: Download application artifacts (debug)
        uses: actions/download-artifact@v4.3.0
        with:
          path: release-files
          merge-multiple: true
      - name: Create Source.zip and SHA.zip (debug)
        run: |
          git archive --format=zip --output=release-files/Source.zip HEAD
          (
            cd release-files
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' ! -name 'SHA.zip' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            zip -q SHA.zip SHA256SUMS.txt
          )
      - name: Upload Source.zip (debug)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: source-debug
          path: release-files/Source.zip
          if-no-files-found: error
      - name: Upload SHA.zip (debug)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: sha-debug
          path: release-files/SHA.zip
          if-no-files-found: error